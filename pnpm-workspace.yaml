  prosemirror-view: 1.42.3
  prosemirror-model: 1.25.12
  "@types/express": 4.17.23
  typescript: "catalog:"
  vite: "catalog:"
  qs: 6.16.1
  diff: 5.2.2
  webpack: 5.104.1
  lodash-es: "catalog:"
  lodash: 4.18.1
  markdown-it: 14.3.3
  "minimatch@3": 3.1.4
  # 10.2.6, the newest 10.x. This clears NO advisory — minimatch's fix is >=11.0.1 — and it is held
  # here by `glob@11.1.0`, which declares `^10.1.1` and is minimatch's sole remaining dependent, so
  # going to 11.0.1 for the advisory would violate glob 11's range instead. The original reason
  # written here was a floor of `^10.2.4` from `eslint@10.4.1`; eslint left the tree with
  # react-doctor on 2026-11-12, so that half is obsolete even though the conclusion is not
  # (APLANE-44).
  "minimatch@10": 10.2.6
  "ajv@6": 6.14.0
  "ajv@8": 8.18.0
  # APLANE-44: unpinned transitives that resolved below their advisory fix. All patch or minor
  # within the line they were already on, and each is the FLOOR of the fix rather than the latest,
  # so the change is the smallest one that clears the advisory. browserslist and
  # baseline-browser-mapping are browser-data packages pulled by every app (97 paths each);
  # source-map-js comes in through postcss; postcss-selector-parser has two major lines live at
  # once, so both need pinning, the same shape as the ajv and minimatch pairs above.
  # NO toml override any more, and no toml in the tree at all (APLANE-44, 2026-11-12). Its only
  # dependent was `effect@4.0.0-beta.70`, whose only ROOT was the `react-doctor` devDependency of
  # the root package.json — it had two direct dependents, the other being
  # `@effect/platform-node-shared`, whose own only dependent was react-doctor again. And nothing
  # consumed that package: the `doctor` script is `npx react-doctor@latest` (which goes to the
  # registry, not to node_modules) and .github/workflows/react-doctor.yml uses the
  # `millionco/react-doctor@v2` GitHub Action, which brings its own tool.
  #
  # Dropping the devDependency cleared five advisory IDs — toml's four highs plus 1245930 — with no
  # version bump anywhere: measured across all 445 importer→dep entries, 0 base versions changed.
  # **1245930 and 1245931 share one GHSA, chp3-j5qr-2vfr** (cookie attribute injection) but are NOT
  # one bug counted twice — that was the first reading here and it is wrong. They were two distinct
  # INSTALLED packages on two different version lines: 1245930 was `effect@4.0.0-beta.70` (range
  # >=4.0.0-beta.0 <4.0.0-beta.103, `dev: true`, every path under react-doctor) and 1245931 was
  # `@effect/platform@0.94.1` (range <0.97.1, `dev: false`, every path starting at `apps__live`).
  # apps/live's own `effect@3.20.0` is in neither range, which is why it was never flagged.
  # **So the rule is not "count GHSAs" — read each finding's PATH and its `dev` flag.** Counting
  # GHSAs would have merged a dev-only tool with a package in the shipped image and UNDERcounted.
  # Dropping react-doctor cleared the dev-only half; the shipped half kept shipping until the two
  # declarations left apps/live on 2026-11-12 (same ticket).
  #
  # **UPSTREAM declared those two** — b31c0195bc, "fix: pdf export" (#8564) — and never imported
  # them: `git log -G "@effect" -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs'` is empty over ALL history.
  # A `-S` pickaxe would not have settled that (an add and a remove in one commit net to zero and
  # are invisible to it). apps/live uses `effect` core only, and the TYPE SYSTEM is what forecloses
  # an implicitly-provided platform layer: `exportToPdf` declares `R = PdfExportService` and
  # pdf-export.controller.ts runs it through `Effect.runPromise`, which requires `R = never`, so a
  # FileSystem/Path/HttpClient/NodeContext requirement would land in `R` and fail L0-05/L0-08.
  #
  # Removing them took **36** packages out of the tree (1608 -> 1572, 0 added, lockfile
  # 578539 -> 558553 bytes) with 0 base version changes and 0 peer re-resolutions across all 442
  # importer→dep entries. The 36, which must add up: 8 `@effect/*`, `@parcel/watcher` + its 13
  # prebuilt binaries, `msgpackr`, `msgpackr-extract` + its 6 binaries,
  # `node-gyp-build-optional-packages`, `node-addon-api`, `mime@3`, `kubernetes-types`,
  # `multipasta`, `find-my-way-ts`. An earlier version of this comment also listed `lmdb`: wrong, it
  # was an OPTIONAL peer of `@effect/experimental` and never resolved into the tree at all — the
  # name came from a parser that mistook a `peerDependenciesMeta` key for a package.
  # `pnpm audit --audit-level=moderate`: 5 -> 4. At the DEFAULT level it is 6 -> 5, the extra being a
  # `deepmerge` low that was never on this ticket's list; every count in this file is at moderate.
  #
  # `@parcel/watcher` and `msgpackr-extract` were dropped from `allowBuilds` below in the same
  # commit, because nothing in the tree brings them any more.
  #
  # Expect an upstream merge to put the two declarations back, and know what that costs before
  # keeping them. **Re-adding them does NOT bring back 0.94.1/0.104.0.** Measured 2026-11-12 by
  # restoring the declarations over the post-change lockfile: the catalog ranges were `^0.94.0` and
  # `^0.104.0`, so a fresh resolve takes the newest of those lines — 0.94.5 and 0.104.1, with newer
  # @parcel/watcher and msgpackr behind them, 28 packages moved — and **0.94.5 is still inside the
  # advisory range, which is `<0.97.1`**. For a 0.x package `^0.94.0` means `<0.95.0`, so that
  # catalog entry could never reach the fix at all. Re-declaring these is not a way to clear
  # chp3-j5qr-2vfr; not needing them is. If an upstream merge reinstates them, the catalog entries
  # have to be written `^0.97.1`/the matching platform-node line, and the two `allowBuilds` entries
  # come back with them.
  #
  # Two peer re-resolutions came with it, both harmless and neither a version change: `jiti`
  # 2.7.0 -> 2.6.1 for vite/vitest/postcss-cli/@react-router/dev, and `@opentelemetry/api` dropped
  # out of vitest's resolution. jiti is an OPTIONAL peer declared `>=1.21.0` by both vite@8.1.6 and
  # postcss-load-config@5.1.0, so no range is violated — and 2.7.0 was in the tree ONLY because a
  # dev-only tool put it there, while 2.6.1 is anchored by real dependencies (@tailwindcss/node,
  # unconfig). The toolchain's loader is more deterministic after this, not less.
  #
  # apps/live still uses `effect`, at the catalog's 3.20.0, which declares no toml.
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  source-map-js: 1.2.2
  "postcss-selector-parser@6": 6.1.5
  "postcss-selector-parser@7": 7.1.6
  "undici@7": 7.30.1
  flatted: 3.4.2
  picomatch: 2.3.2
  "yaml@1": 1.10.3
  "yaml@2": 2.8.3
  path-to-regexp: 0.1.13
  defu: 6.1.5
  postcss: 8.5.25
  axios: "catalog:"
  follow-redirects: 1.16.2
  uuid: "catalog:"
  "fast-uri@<3.1.9": "3.1.9"
  "js-yaml@4": 4.3.2
  linkify-it: 5.0.2
  body-parser: 1.20.9
  "@react-router/node": 7.18.2
  tmp: 0.2.7
  form-data: 4.0.6
  "ws@8": 8.21.0
  "ws@7": 7.5.11
  # The three "@opentelemetry/*" pins that sat here are gone (APLANE-44, 2026-11-12): every
  # @sentry/* and @opentelemetry/* package left the tree with react-doctor, which reached them
  # through @sentry/node@10.26.0, and nothing in this repo imports either. An override that names a
  # package nobody depends on is dead config that reads like a decision. For these three the
  # "bit-for-bit identical" measurement holds in full: `@opentelemetry/core`, `/resources` and
  # `/sdk-trace-base` appear **0 times** anywhere in the lockfile, so no manifest in the tree
  # declares them as a dependency OR a peer and there was nothing for the override to touch.
  #
  # **But do not generalise that to every dead override, and it is not cosmetic.** Measured
  # 2026-11-12 on `rollup: 4.59.0` (removed below): pnpm had been rewriting the recorded peer range
  # of `@rollup/pluginutils@5.2.0` from its declared `^1.20.0||^2.0.0||^3.0.0||^4.0.0` to the
  # literal `4.59.0` — one `packages:` entry's contents, no `snapshots:` content, and no
  # resolution, since rollup is in no `packages:` entry and that peer is `optional: true`.
  #
  # Read from the PINNED pnpm 11.3.0 bundle, because this is the mechanism and not a guess:
  # `createVersionsOverrider` is a readPackage hook over EVERY manifest pnpm reads, and
  # `overrideDeps` matches on `targetPkg.name === name && isIntersectingRange(...)` — so the name
  # matching is necessary but **the ranges must also intersect**, which is why the @opentelemetry
  # pins touched nothing and this one did. Two consequences worth knowing before writing an
  # override: a value that is not a valid peer range is written into `dependencies` instead
  # (`deps[name] = newBareSpecifier`), so an override can INJECT a dependency; and the value `"-"`
  # **deletes** the entry. None of this is special to dead overrides — the live `vite: "catalog:"`
  # is rewriting vitest's recorded `vite` peer right now. What is specific to a dead one is that
  # nothing justifies the rewrite.
  #
  # `rollup: 4.59.0` and `serialize-javascript: 7.0.5` were the two left behind here on 2026-11-12
  # as "already dead before this change, not mine to bundle in". They are gone now, together with a
  # stale `@storybook/csf-plugin@10.5.10` in `minimumReleaseAgeExclude` (10.6 folded that package
  # in, so it is absent at ANY version) and two orphan `catalog:` entries,
  # `@tanstack/react-virtual` and `@tanstack/virtual-core`. Those last two are the subtlest shape of
  # this bug and the reason the new L0-10 gate stage checks the catalog too: both packages ARE in
  # the tree at the pinned 3.13.12, pulled by `@headlessui/react@1.7.19` (whose own declared range
  # is `^3.0.0-beta.60`), so the pin reads as satisfied — but **no manifest references them as
  # `catalog:`, so the catalog decided nothing in this tree**; headlessui's range did, and pnpm
  # never recorded either package in the lockfile's own `catalogs:` block, which is the check to
  # run on a suspected orphan. Their caret ranges, against this file's exact-pin rule, were the
  # tell.
  #
  # Two precisions. **They were not completely without effect**: in pnpm 11.3.0's add path, when an
  # alias is in the default catalog and no version is given, the bare specifier is rewritten to
  # `"catalog:"` — so a future `pnpm add @tanstack/react-virtual` in any workspace package would
  # have picked up `^3.13.12` and will now take the newest instead. That is the plausible original
  # intent, and it is still the wrong tool for a transitive. **And pinning a transitive needs an
  # `overrides:` entry — whose VALUE may perfectly well come from the catalog**: this file does
  # exactly that six times (express, typescript, vite, lodash-es, axios, uuid). The thing that
  # cannot pin a transitive is a catalog entry with no override and no manifest reference.
  morgan: 1.12.1
  compression: 1.8.2
  proxy-addr: 2.0.8
  tinypool: 2.1.2

allowBuilds:
  "@swc/core": true
  esbuild: true
  turbo: true
  sharp: false

# NOTE: no `minimumReleaseAge` is set in .npmrc or here, so this list currently has no effect.
