# Docker Compose for running the API pytest suite in a contained environment.
#
# Prerequisite:
#   ./setup.sh    # creates apps/api/.env (and the other env files) from .env.example
#
# Usage:
#   # Run the full suite (defaults to `pytest`):
#   docker compose -f docker-compose-test.yml up --build --abort-on-container-exit --exit-code-from api-tests
#
#   # Run a subset by overriding the command:
#   docker compose -f docker-compose-test.yml run --rm --build api-tests pytest -m unit
#   docker compose -f docker-compose-test.yml run --rm api-tests pytest plane/tests/unit -k "test_workspace"
#
#   # Tear down (removes ephemeral volumes and the test network):
#   docker compose -f docker-compose-test.yml down -v
#
# Notes:
# - Postgres / Valkey / RabbitMQ / MinIO start with health checks; the test
#   runner only starts once each dependency is healthy.
# - Data dirs are tmpfs so every run begins from a clean state.
# - Env vars come from apps/api/.env (the same file the local stack uses); tests
#   use plane.settings.test, which inherits from common and reads DATABASE_URL,
#   REDIS_URL, RABBITMQ_* etc. from the environment.

services:
  test-db:
    image: postgres:15.7-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-redis:
    image: valkey/valkey:7.2.11-alpine
    networks:
      - test_env
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-mq:
    image: rabbitmq:3.13.6-management-alpine
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  test-minio:
    # minio/minio is GONE from Docker Hub — the hub API answers 404 and the registry answers
    # "denied" (checked 2026-11-09 from a host that had never cached it). It was declared UNTAGGED
    # here, so L2 kept passing only because the VPS still held a 14-month-old :latest locally; and
    # L2 is a gate stage, so the first docker prune would have stopped plane-deploy reaching prod
    # at all, as what looks like unrelated infrastructure trouble (APLANE-42).
    # quay.io/minio/minio is not an alternative: no manifest for :latest or for that release.
    # pgsty/silo is PGSTY's maintained MinIO fork, and the SAME image dev and prod have run since
    # 2026-10-23 (AINF-475) — matching them rather than picking a third thing. Pinned to
    # tag@digest, because this ticket exists because an untagged image was assumed permanent.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
    # The binary is `silo`, NOT `minio` — AINF-475's "same `server /data` argv" meant the
    # arguments, not the name, and `exec minio server` dies with "exec: minio: not found" while
    # the container still reports itself up for a moment. Verified by running it, 2026-11-09.
    #
    # The `mc alias` + `mc mb` steps are gone, and NOT because mc is missing: it is at
    # /usr/bin/mc in this image. They were always redundant — the backend is filesystem-backed, so
    # the `mkdir` below IS what creates the bucket, and `mc mb` only repeated it. Dropping them
    # also drops the `server &` + `tail -f /dev/null` shape, so the server is PID 1: if it dies
    # the container stops, instead of staying up with nothing listening.
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/${AWS_S3_BUCKET_NAME:-uploads} &&
      exec silo server /export --console-address ':9090'
      "
    tmpfs:
      - /export
    healthcheck:
      # `mc ready local` needed an `mc alias` the entrypoint no longer sets. The server's own
      # liveness endpoint needs no alias; curl is at /usr/bin/curl. No shell pipeline and no grep
      # in a healthcheck here — this image has curl and mc but NO grep.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-tests:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
      args:
        DOCKER_BUILDKIT: 1
    networks:
      - test_env
    env_file:
      - ./apps/api/.env
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.test
      # Override service hostnames to point at the test-only services above.
      POSTGRES_HOST: test-db
      DATABASE_URL: postgresql://${POSTGRES_USER:-plane}:${POSTGRES_PASSWORD:-plane}@test-db:5432/${POSTGRES_DB:-plane}
      REDIS_HOST: test-redis
      REDIS_URL: redis://test-redis:6379/
      RABBITMQ_HOST: test-mq
      AWS_S3_ENDPOINT_URL: http://test-minio:9000
      # Magic-link tests mock the celery delay but the view first checks that
      # EMAIL_HOST is configured. Set a placeholder so the check passes.
      EMAIL_HOST: test-smtp.invalid
    volumes:
      - ./apps/api:/code
    working_dir: /code
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-mq:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    # Install test-only requirements (not in local.txt) then exec pytest.
    # Any args passed via `docker compose run api-tests <args>` replace the default command.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        pip install --no-cache-dir -r requirements/test.txt
        # STATIC_ROOT must exist or Django's static middleware emits a
        # UserWarning on every request (~100 of the warnings in test runs).
        mkdir -p plane/static-assets/collected-static
        exec "$@"
      - --
    command: ["pytest"]

networks:
  test_env:
    driver: bridge
