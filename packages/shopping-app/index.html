<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The gate's /shopping/ check keys on this marker: the main app's shell, which the server returns
         for any missing file, never has it (brief, "The deploy gate and this feature"). -->
    <meta name="plane-shopping-shell" content="1" />
    <meta name="theme-color" content="#141415" />
    <meta name="color-scheme" content="dark light" />
    <title>Shopping</title>
    <!-- use-credentials (APLANE-75): behind Cloudflare Access a manifest fetched without cookies gets the sign-in
         302. The worker hid that after the first visit; the first visit itself had no installable manifest. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // APLANE-83: if the app's script cannot load (a shell from before an update whose script is gone), reload
      // once instead of leaving a blank page; the reload gets the current version. At most once a minute.
      addEventListener(
        "error",
        function (e) {
          var s = e.target;
          if (!s || s.tagName !== "SCRIPT" || s.type !== "module") return;
          try {
            var k = "plane-shopping-reloaded-at";
            if (Date.now() - (Number(sessionStorage.getItem(k)) || 0) < 60000) return;
            sessionStorage.setItem(k, String(Date.now()));
          } catch (_) {
            return;
          }
          location.reload();
        },
        true
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
